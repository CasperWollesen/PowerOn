<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PowerOn tests</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 900px; margin-inline: auto; line-height: 1.4; }
    h1 { font-size: 1.1rem; }
    .summary { font-weight: 700; padding: 10px 14px; border-radius: 10px; }
    .summary.pass { background: #dcfce7; color: #166534; }
    .summary.fail { background: #fee2e2; color: #991b1b; }
    .results { list-style: none; padding: 0; margin: 14px 0; }
    .results li { display: grid; grid-template-columns: 20px 130px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px solid #8883; font-size: 0.9rem; }
    .results li.bad { color: #b91c1c; }
    .results .err { grid-column: 3; font-family: ui-monospace, monospace; font-size: 0.8rem; }
    .results .req { font-family: ui-monospace, monospace; font-size: 0.78rem; opacity: 0.7; }
    .mark { font-weight: 700; }
    #results-json { display: none; }
  </style>
</head>
<body>
  <h1>PowerOn tests</h1>
  <p>Unit tests for the pure modules. Run headless with <code>python dev/run-tests.py</code>.</p>
  <div id="output">Running…</div>
  <script type="module">
    import { run } from './harness.js';
    await import('./all.js');
    await run(document.getElementById('output'));
  </script>
</body>
</html>
